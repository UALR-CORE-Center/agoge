  functional_performance_criteria:
    notes: ''
    disabled: false
    criteria:
      - num: '302.1'
        components:
          - name: none
            adherence:
              level: partially-supports
              notes: >-
                Most interactive elements are accessible via keyboard and
                labeled correctly for screen readers. However, current lack of
                semantic landmarks, consistent heading structure, and ARIA-live
                announcements of status changes create barriers for blind users.
                The 2025 Q4 release will add semantic landmarks (&lt;main&gt;,
                &lt;nav&gt;, &lt;header&gt;), consistent headings (&lt;h1&gt;,
                &lt;h2&gt; hierarchy), and ARIA-live status messages to fully
                support screen reader
                navigation.&lt;/h2&gt;&lt;/h1&gt;&lt;/header&gt;&lt;/nav&gt;&lt;/main&gt;
      - num: '302.2'
        components:
          - name: none
            adherence:
              level: partially-supports
              notes: >-
                The interface is responsive and supports zooming and text
                resizing, but certain status labels and interactive elements
                have insufficient contrast. The 2025 Q4 release will improve the
                color palette, contrast ratios, and add clearer visible focus
                indicators for low-vision users.
      - num: '302.3'
        components:
          - name: none
            adherence:
              level: partially-supports
              notes: >-
                Most content does not rely solely on color; however, certain
                status indicators ("Ready," "Running," "Error") depend primarily
                on color cues. The 2025 Q4 update will introduce redundant text
                labels and shape-based indicators to eliminate color-only
                dependencies.
      - num: '302.4'
        components:
          - name: none
            adherence:
              level: supports
              notes: >-
                The software does not contain audio-only or audio-dependent
                content. All instructions and notifications are visually
                displayed.
      - num: '302.5'
        components:
          - name: none
            adherence:
              level: supports
              notes: Same as 302.4. No barriers exist related to hearing limitations.
      - num: '302.6'
        components:
          - name: none
            adherence:
              level: supports
              notes: The software does not require speech input or interaction.
      - num: '302.7'
        components:
          - name: none
            adherence:
              level: partially-supports
              notes: >-
                Keyboard navigation is generally functional, but some
                interactive elements (like modal dialogs and DataGrid rows) have
                inconsistent keyboard navigation paths. The planned 2025 Q4
                release includes enhancements to ensure robust, predictable
                keyboard access to all interactive elements and clearer focus
                indicators.
      - num: '302.8'
        components:
          - name: none
            adherence:
              level: supports
              notes: >-
                The software does not require precise reach or significant
                physical exertion. Standard interface controls are easily
                operable without demanding dexterity or prolonged physical
                interaction.
      - num: '302.9'
        components:
          - name: none
            adherence:
              level: partially-supports
              notes: >-
                While instructions and UI labels are clear, current form
                validation messages lack specific, actionable error suggestions,
                potentially creating confusion for users with cognitive or
                learning disabilities. The 2025 Q4 update will provide improved
                inline validation with specific correction guidance and
                standardized messages to simplify understanding and interaction.
