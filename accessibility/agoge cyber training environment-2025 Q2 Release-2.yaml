evaluation_methods_used: >-
  The accessibility assessment of the Agoge CTE (Student Mode) software involved
  a combination of manual inspection, automated tools, and assistive technology
  testing.


  Manual Code Inspection - Evaluators reviewed the provided HTML, CSS,
  JavaScript, and React component source files to identify accessibility support
  and gaps according to WCAG 2.1 guidelines and Section 508 Functional
  Performance Criteria.


  Automated Testing: Lighthouse was used to perform automated analysis on sample
  pages and interactive components, verifying compliance with WCAG 2.1 Level A
  and AA success criteria.


  Keyboard Navigation Testing: Manual keyboard navigation tests (Tab, Shift+Tab,
  Enter, and Spacebar) were conducted to verify operability, focus visibility,
  and absence of keyboard traps throughout user workflows.


  Color Contrast Analysis: Contrast levels were evaluated using WCAG-approved
  color contrast analyzers (e.g., WebAIM Contrast Checker) for text and
  interactive elements.


  Identified accessibility issues have been documented, and specific
  enhancements are planned and detailed in this report, targeted for completion
  in the 2025 Q4 software release.
