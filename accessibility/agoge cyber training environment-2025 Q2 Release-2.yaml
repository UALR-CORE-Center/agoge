title: Agoge Cyber Training Environment Accessibility Conformance Report
product:
  name: Agoge Cyber Training Environment
  version: 2025 Q2 Release
  description: >-
    Agoge’s platform simulates complex, real-world cybersecurity environments in
    the cloud. It create virtual replicas of real-world systems, devices, and
    networks, offering trainees the opportunity to practice and refine their
    skills in an environment that mimics real cyber environments.
