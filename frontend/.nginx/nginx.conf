worker_processes 4;

events { worker_connections 1024; }

http {
    server {
        listen 8080;

        gzip on;
        gzip_disable "msie6";

        gzip_comp_level 6;
        gzip_min_length 1100;
        gzip_buffers 16 8k;
        gzip_proxied any;
        gzip_types
            text/plain
            text/css
            text/js
            text/xml
            text/javascript
            application/javascript
            application/json
            application/xml
            application/rss+xml
            image/svg+xml;

        root /usr/share/nginx/html;
        index /index.html;
        include /etc/nginx/mime.types;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html names the hashed bundle, so a cached copy keeps running the previous deploy
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Vite content-hashes everything under assets/, so a changed file always has a new name
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }
}
