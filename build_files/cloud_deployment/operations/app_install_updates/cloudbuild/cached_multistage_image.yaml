# Cached build for a multi-stage Dockerfile whose first stage is named
# "builder". Inline cache only records the final stage, so the builder stage
# is pushed as its own image (${_IMAGE}-builder) to keep the npm ci layer warm.
steps:
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', 'docker pull ${_IMAGE}-builder:latest || true; docker pull ${_IMAGE}:latest || true']
  - id: build-builder
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --target=builder
      - --cache-from=${_IMAGE}-builder:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --tag=${_IMAGE}-builder:latest
      - .
  - id: build
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --cache-from=${_IMAGE}-builder:latest
      - --cache-from=${_IMAGE}:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --tag=${_IMAGE}:latest
      - .
images: ['${_IMAGE}:latest', '${_IMAGE}-builder:latest']
options:
  machineType: E2_HIGHCPU_8
