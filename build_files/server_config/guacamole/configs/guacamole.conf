server {
    listen 80;
    # GUAC_HOST will be replaced using sed in the container build process.
    server_name GUAC_HOST;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name GUAC_HOST;

    # GUAC_DOMAIN will be replaced using sed in the container build process.
    ssl_certificate /etc/letsencrypt/live/GUAC_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/GUAC_DOMAIN/privkey.pem;

    location / {
        proxy_pass http://guacamole:8080/;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}